<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniShop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>MiniShop</h1>
      <button class="cart-button">Panier (0)</button>
    </header>

    <nav class="categories">
      <button class="active">Tous</button>
      <button>Audio</button>
      <button>Périphériques</button>
      <button>Écrans</button>
    </nav>

    <main class="shop">
      <section class="product-list">
        <!-- Les articles ci-dessous doivent être généré dynamiquement -->
        <article class="product-card" data-product-id="1">
          <div
            class="img-placeholder"
            style="background-image: url('https://picsum.photos/600/400')"
          ></div>
          <div class="product-info">
            <div class="product-info-top">
              <h2>Casque Audio Pro</h2>
              <span>audio</span>
            </div>
            <p>199.99 €</p>
            <button class="add-to-cart" data-product-id="1">
              Ajouter au panier
            </button>
          </div>
        </article>
        <article class="product-card" data-product-id="1">
          <div
            class="img-placeholder"
            style="background-image: url('https://picsum.photos/600/400')"
          ></div>
          <div class="product-info">
            <div class="product-info-top">
              <h2>Casque Audio Pro</h2>
              <span>audio</span>
            </div>
            <p>199.99 €</p>
            <button class="add-to-cart" data-product-id="1">
              Ajouter au panier
            </button>
          </div>
        </article>
        <article class="product-card" data-product-id="1">
          <div
            class="img-placeholder"
            style="background-image: url('https://picsum.photos/600/400')"
          ></div>
          <div class="product-info">
            <div class="product-info-top">
              <h2>Casque Audio Pro</h2>
              <span>audio</span>
            </div>
            <p>199.99 €</p>
            <button class="add-to-cart" data-product-id="1">
              Ajouter au panier
            </button>
          </div>
        </article>
        <article class="product-card" data-product-id="1">
          <div
            class="img-placeholder"
            style="background-image: url('https://picsum.photos/600/400')"
          ></div>
          <div class="product-info">
            <div class="product-info-top">
              <h2>Casque Audio Pro</h2>
              <span>audio</span>
            </div>
            <p>199.99 €</p>
            <button class="add-to-cart" data-product-id="1">
              Ajouter au panier
            </button>
          </div>
        </article>
      </section>
    </main>

    <aside class="cart-sidebar">
      <div class="cart-panel">
        <h2>Panier</h2>
        <ul class="cart-items">
          <!-- Le contenu sera généré dynamiquement -->
        </ul>
        <div class="cart-total">Total: <span>0.00 €</span></div>
      </div>
    </aside>

    <!-- Module d'accessibilité (en bas à droite de la page) -->
    <div class="accessibility-wrapper">
      <!-- Bouton qui ouvre / ferme le panneau -->
      <button
        class="accessibility-toggle"
        aria-expanded="false"
        aria-controls="accessibility-panel"
      >
        Options d'accessibilité
      </button>

      <!-- Panneau des options, masqué tant qu'il n'a pas la classe .active -->
      <div class="accessibility-panel" id="accessibility-panel">
        <div class="font-size-group">
          <p class="accessibility-title">Taille du texte</p>
          <div class="font-size-controls">
            <button class="font-btn" id="font-decrease" aria-label="Réduire la taille du texte">A-</button>
            <button class="font-btn" id="font-increase" aria-label="Agrandir la taille du texte">A+</button>
          </div>
        </div>
        <button class="access-btn" id="dark-mode-btn" aria-pressed="false">Mode sombre</button>
        <button class="access-btn" id="dyslexia-btn" aria-pressed="false">Police dyslexie</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
