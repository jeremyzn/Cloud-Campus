<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · GitHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <header class="decor">
    <div class="scene">
      <h1 class="titre">404</h1>
      <p class="bulle">This is not the web page you are looking for.</p>

      <img class="maison-2" src="images/maison-2.png" alt="" width="120" height="50">
      <img class="maison-1" src="images/maison-1.png" alt="" width="300" height="120">
      <img class="ombre-vaisseau" src="images/ombre-vaisseau.png" alt="" width="430" height="75">
      <img class="ombre-octocat" src="images/ombre-octocat.png" alt="" width="170" height="50">
      <img class="vaisseau" src="images/vaisseau.png" alt="" width="440" height="160">
      <img class="octocat" src="images/octocat.png" alt="" width="190" height="230">
    </div>
  </header>

  <main class="contenu">
    <form class="recherche" id="formulaire" action="https://github.com/search" method="get">
      <label for="champ">Find code, projects, and people on GitHub:</label>
      <input id="champ" type="text" name="q">
      <button class="bouton" type="submit">Search</button>
      <p class="erreur" id="erreur"></p>
    </form>
  </main>

  <footer class="contenu">
    <p class="liens">
      <a href="https://support.github.com?tags=dotcom-404">Contact support</a> -
      <a href="https://githubstatus.com">GitHub Status</a> -
      <a href="https://x.com/githubstatus">@githubstatus</a>
    </p>

    <a class="logo" href="https://github.com">
      <img src="images/logo.png" alt="GitHub" width="30" height="30">
    </a>
  </footer>

</body>
</html>
